<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LocalMSG</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  
  <div id="login-overlay">
    <div class="login-box">
      <h2 style="margin:0; color:#00ffcc;">Identify Yourself</h2>
      <input type="text" id="name-input" placeholder="Enter your name..." autofocus>
    </div>
  </div>

  <div id="chat-history"></div>

  <div id="input-area">
    <input type="text" id="message-input" placeholder="Type a message and press Enter...">
    
    <div id="hamburger-container">
      <button id="hamburger-btn" title="Menu">☰</button>
      <div id="dropdown-menu">
        <button id="theme-btn" class="menu-item">🎨 Print Mode</button>
        <button id="mute-btn" class="menu-item">🔇 Mute Chat</button>
      </div>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
